<style>
  .pomosh {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    padding-bottom: 20px; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Тонкая аккуратная линия */
  .border {
    border: 0;
    height: 1px;
    background-color: #e0e0e0; /* Светло-серый цвет линии */
    margin: 0 0 15px 0; /* Отступ только снизу линии */

  }

  /* Центрирование текста */

  }

  /* Стили для кликабельной ссылки */
  .link {
    color: #0066cc; /* Синий цвет ссылки */
    text-decoration: none; /* Убираем стандартное подчеркивание */
    font-weight: 500;
    margin-left: 5px;
  }

  /* Эффект при наведении на ссылку */
  .support-link:hover {
    text-decoration: underline; /* Подчеркивание появляется при наведении */
    color: #004499; /* Цвет становится чуть темнее */
  }
</style>
